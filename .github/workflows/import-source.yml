name: Import Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/chunks/**'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-validate-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged source
        uses: actions/checkout@v5

      - name: Reconstruct and verify audited source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/chunk_*.part > /tmp/dhs-source.b64
          echo 'ccc9952c51a9f5c718d5990662656c52f8b310f2809ee1899b3380533899505e  /tmp/dhs-source.b64' | sha256sum -c -
          base64 -d /tmp/dhs-source.b64 > /tmp/dhs-source.tar.xz
          echo 'f1bb3db2f4839842c56d35bec61af7e9eaca795f7681fe944a4fe74dd8fb18a1  /tmp/dhs-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/dhs-source.tar.xz -C .
          test -f package.json
          test -f App.tsx
          test -f README.md
          test -f .github/workflows/ci.yml

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck and build on Node.js 20
        run: npm run check

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Reinstall from lockfile on Node.js 22
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist .vite
          npm ci --no-audit --no-fund

      - name: Typecheck and build on Node.js 22
        run: npm run check

      - name: Finalize repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('npm install --no-audit --no-fund', 'npm ci --no-audit --no-fund')
          p.write_text(s)
          PY
          rm -rf node_modules dist .vite .bootstrap
          rm -f .github/workflows/import-source.yml

      - name: Commit finalized DHS App v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Release DHS App v1.0.0'
          git push origin HEAD:main
